# aipp_op
# {
#     aipp_mode: dynamic
#     input_format :  RGB888_U8
#     src_image_size_w : 1008     # 输入图像的实际宽度 1008
#     src_image_size_h : 1008     # 输入图像的实际高度 1008
#     related_input_rank: 0       # 标识对第1个输入进行AIPP处理(pixel_values)
#     max_src_image_size: 3048192 # 输入图像最大的size(RGB:n*w*h*3 YUV420:n*w*h*3/2)，参数必填 sam3默认输入尺寸1008 x 1008
# }
aipp_op {
    aipp_mode: static
    related_input_rank: 0       # 标识对第1个输入进行AIPP处理(pixel_values)
    input_format :  RGB888_U8
    src_image_size_w : 1008  # 输入图像的实际宽度 1008
    src_image_size_h : 1008  # 输入图像的实际高度 1008

    # 1. 核心修改：输入已经是 BGR/RGB 家族，无需色彩空间转换（CSC）
    csc_switch : false
    
    # 2. 核心修改：在 NPU 硬件内直接将 BGR 交换为 RGB 输送给模型
    rbuv_swap_switch : true

    # 关闭 Crop
    crop: false 

    # 3. 归一化配置：x_new = (x - mean) * var_reci
    # sam3预处理要求x' = (x / 255.0f - 0.5f) / 0.5f -->x' = (x  - 0.5f * 255) / 0.5f * 255
    # 减均值 128（近似 PyTorch 的 127.5）；乘系数 1/127.5 ≈ 0.007843137
    min_chn_0 : 0 
    min_chn_1 : 0
    min_chn_2 : 0
    mean_chn_0: 128
    mean_chn_1: 128
    mean_chn_2: 128
    var_reci_chn_0: 0.00784313725490196
    var_reci_chn_1: 0.00784313725490196
    var_reci_chn_2: 0.00784313725490196
}